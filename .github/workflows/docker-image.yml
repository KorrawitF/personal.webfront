name: Docker Image CI

env:
  REGISTRY: ghcr.io

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: published

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4
        
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
          registry: ${{ env.REGISTRY }}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
          
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=1.0.0,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}

    - name: Build and Push Image
      uses: docker/build-push-action@v5
      with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  call-webhook:
    needs: build-and-push
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
    - name: Call webhook
      env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_HOOK }}
      run: |
        if [ -z "$WEBHOOK_URL" ]; then
          echo "::error::The WEBHOOK_URL secret is not set."
          exit 1
        fi
        curl --verbose --location --max-time 30 --write-out "\nHTTP status: %{http_code}\n" "$WEBHOOK_URL"
